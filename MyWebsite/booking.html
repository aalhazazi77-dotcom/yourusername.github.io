<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موتر بلس | حجز الخدمة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* تعريف الألوان الأساسية */
        :root { 
            --primary-color: #004d40; /* الأخضر الداكن (الرئيسي) */
            --secondary-color: #ffc107; /* الأصفر العنبري */
            --text-color: #333; 
            --white: white; 
            --green-btn: #004d40; /* تم استبدال اللون الأزرق بهذا الأخضر للزر */
        }
        body { font-family: 'Cairo', sans-serif; margin: 0; padding: 0; box-sizing: border-box; background-color: #f4f7f6; direction: rtl; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        
        /* رأس الصفحة (Header) - يبقى أخضر داكن */
        header { background-color: var(--primary-color); color: var(--white); padding: 15px 0; position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .header-content { display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; font-size: 1.8em; font-weight: 900; }
        nav ul { list-style: none; padding: 0; display: flex; margin: 0; }
        nav ul li { margin-left: 25px; }
        nav ul li a { color: var(--white); text-decoration: none; font-weight: 700; transition: color 0.3s ease; }
        nav ul li a:hover { color: var(--secondary-color); }
        
        /* زر الإرسال (تم تغيير لون الخلفية من الأزرق إلى الأخضر الداكن) */
        .btn { 
            background-color: var(--green-btn); /* تم استخدام اللون الأخضر الداكن */
            color: var(--white); 
            padding: 12px 25px; 
            border: none; 
            border-radius: 5px; 
            font-size: 1.1em; 
            cursor: pointer; 
            transition: background-color 0.3s ease; 
            text-decoration: none; 
            font-weight: bold; 
            display: inline-block; 
        }
        .btn:hover {
             background-color: #00332b; /* درجة أغمق عند التمرير */
        }

        footer { background-color: var(--primary-color); color: var(--white); padding: 30px 0; text-align: center; font-size: 0.9em; margin-top: 50px;}

        /* تنسيقات نموذج الحجز */
        .booking-section { padding: 50px 0; }
        .form-container { max-width: 600px; margin: 30px auto; background-color: var(--white); padding: 30px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .form-title { text-align: right; color: var(--text-color); font-size: 2.2em; font-weight: 700; margin-bottom: 30px;}
        .form-group { margin-bottom: 25px; }
        .form-group label { display: block; font-weight: 700; margin-bottom: 5px; color: var(--text-color); font-size: 1.1em; }
        .form-group input, .form-group select { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ccc; 
            border-radius: 5px; 
            box-sizing: border-box; 
            font-size: 1em; 
            direction: rtl; 
            font-family: 'Cairo', sans-serif;
            transition: border-color 0.3s;
        }
        .form-group input:focus, .form-group select:focus { border-color: var(--primary-color); outline: none; }
        
        #selected-service-display { 
            background-color: var(--secondary-color); 
            color: var(--text-color); 
            padding: 10px; 
            border-radius: 5px; 
            margin-bottom: 20px; 
            font-weight: bold; 
            text-align: center; 
            display: none; 
        }
    </style>
</head>
<body>
    <header>
        <div class="container header-content">
            <h1>موتر بلس</h1>
            <nav>
                <ul>
                    <li><a href="index.html">الرئيسية</a></li>
                    <li><a href="booking.html">احجز خدمتك</a></li>
                    <li><a href="contact.html">الدعم الفني</a></li>
                    <li><a href="#">تسجيل الدخول</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="booking-section container">
        
        <div class="form-container">
            
            <h2 class="form-title">حجز موعد</h2>
            
            <div id="selected-service-display">
                الخدمة المختارة: <span id="selected-service-name">يتم التحميل...</span>
            </div>

            <form id="booking-form">
                
                <div class="form-group"><label for="name">الاسم</label><input type="text" id="name" name="name" required placeholder="اكتب اسمك"></div>
                
                <div class="form-group"><label for="phone">رقم الجوال</label><input type="tel" id="phone" name="phone" required placeholder="05xxxxxxxx"></div>
                
                <div class="form-group">
                    <label for="service-select">الخدمة المطلوبة</label>
                    <select id="service-select" name="service" required>
                        <option value="" disabled selected>--- اختر خدمة ---</option>
                        <option value="oil-change">تغيير زيت المكينة (150 ريال)</option>
                        <option value="transmission">تغيير زيت القير (250 ريال)</option>
                        <option value="full-check">فحص شامل للسيارة (200 ريال)</option>
                        <option value="other">خدمة أخرى (تحديد لاحقاً)</option>
                    </select>
                </div>
                
                <div class="form-group"><label for="date">التاريخ</label><input type="date" id="date" name="date" required></div>
                
                <div class="form-group"><label for="time">الوقت</label><input type="time" id="time" name="time" required></div>
                
                <input type="hidden" id="service-input" name="service-code">
                
                <input type="submit" value="إتمام عملية الحجز" class="btn" style="width: 100%;">
                
                <p style="text-align: center; margin-top: 20px; color: red; font-size: 0.9em;">
                    **ملاحظة: هذا زر إرسال للواجهة الخلفية (Backend) وسيقوم بإرسال الإيميلات عند ربطه بالخادم.**
                </p>
            </form>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2023 موتر بلس. كل الحقوق محفوظة.</p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const serviceSelect = document.getElementById('service-select');
            const selectedServiceNameDisplay = document.getElementById('selected-service-name');
            const selectedServiceDisplay = document.getElementById('selected-service-display');
            const bookingForm = document.getElementById('booking-form');
            
            const urlParams = new URLSearchParams(window.location.search);
            const selectedServiceCodeFromURL = urlParams.get('service');
            
            if (selectedServiceCodeFromURL) {
                selectedServiceDisplay.style.display = 'block';
                serviceSelect.value = selectedServiceCodeFromURL;
                
                const selectedOption = serviceSelect.options[serviceSelect.selectedIndex];
                selectedServiceNameDisplay.textContent = selectedOption.textContent;
            } else {
                serviceSelect.value = ''; 
            }

            serviceSelect.addEventListener('change', () => {
                const selectedOption = serviceSelect.options[serviceSelect.selectedIndex];
                if (selectedOption.value) {
                    selectedServiceDisplay.style.display = 'block';
                    selectedServiceNameDisplay.textContent = selectedOption.textContent;
                } else {
                    selectedServiceDisplay.style.display = 'none';
                }
            });

            const today = new Date().toISOString().split('T')[0];
            document.getElementById('date').setAttribute('min', today);

            bookingForm.addEventListener('submit', (event) => {
                event.preventDefault(); 
                
                const name = document.getElementById('name').value;
                const serviceText = serviceSelect.options[serviceSelect.selectedIndex].textContent;
                
                alert(
                    '✅ طلبك قيد المعالجة!\n\n' +
                    `شكراً لك ${name}، تم إرسال طلب حجز خدمة ${serviceText} إلى الخادم.\n\n` +
                    '**لتلقي هذا الطلب فعلياً، يجب ربط هذا النموذج بواجهة خلفية (Backend) وقاعدة بيانات.'
                );

                bookingForm.reset();
                selectedServiceDisplay.style.display = 'none';
            });
        });
    </script>
</body>
</html>
